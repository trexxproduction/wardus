<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A tiny boba question</title>
  <style>
    :root {
      --ink: #4b2938;
      --muted: #8f5f70;
      --rose: #f06d93;
      --hot-pink: #dd477b;
      --blush: #fff1f5;
      --cream: #fffaf4;
      --tea: #a7674c;
      --shadow: 0 22px 55px rgba(131, 53, 83, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background: #ffdce8;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 34rem;
      height: 34rem;
      border-radius: 50%;
      content: "";
      filter: blur(3px);
      opacity: 0.48;
    }

    body::before {
      top: -13rem;
      left: -9rem;
      background: #ffb5d0;
    }

    body::after {
      right: -13rem;
      bottom: -15rem;
      background: #ffc78c;
    }

    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px 20px;
    }

    .sparkle {
      position: absolute;
      color: #fff;
      font-size: 1.5rem;
      animation: float 4s ease-in-out infinite;
      user-select: none;
    }

    .sparkle.one { top: 12%; left: 13%; }
    .sparkle.two { top: 20%; right: 15%; animation-delay: 1.1s; font-size: 1rem; }
    .sparkle.three { bottom: 16%; left: 16%; animation-delay: 2s; font-size: 1.1rem; }

    .note {
      width: min(100%, 520px);
      padding: 38px 34px 34px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      background: rgba(255, 250, 244, 0.87);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(14px);
      animation: arrive 0.8s ease both;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--hot-pink);
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 420px;
      margin: 0 auto;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.35rem, 8vw, 4rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .boba-stage {
      position: relative;
      width: 160px;
      height: 178px;
      margin: 27px auto 19px;
    }

    .straw {
      position: absolute;
      z-index: 2;
      top: -12px;
      left: 86px;
      width: 12px;
      height: 84px;
      border-radius: 12px;
      background: #f59aaf;
      box-shadow: inset 3px 0 rgba(255, 255, 255, 0.35);
      transform: rotate(12deg);
      transform-origin: bottom;
    }

    .straw::after {
      position: absolute;
      top: -7px;
      left: -5px;
      width: 22px;
      height: 13px;
      border-radius: 50%;
      background: #f59aaf;
      content: "";
    }

    .cup {
      position: absolute;
      bottom: 0;
      left: 22px;
      width: 116px;
      height: 130px;
      overflow: hidden;
      border: 5px solid #f7a6af;
      border-top: 0;
      border-radius: 12px 12px 35px 35px;
      background: linear-gradient(180deg, #f5bba6 0%, #e3a07f 45%, #d38a68 100%);
      box-shadow: 0 9px 0 #ed899d, 0 16px 19px rgba(126, 67, 61, 0.15);
      transform: perspective(200px) rotateX(-3deg);
    }

    .cup::before {
      position: absolute;
      top: -5px;
      left: -6px;
      width: 118px;
      height: 25px;
      border-radius: 50%;
      background: #ffe4d8;
      border: 5px solid #f7a6af;
      content: "";
    }

    .cream {
      position: absolute;
      top: 0;
      left: 2px;
      width: 106px;
      height: 43px;
      border-radius: 50%;
      background: #fff8ef;
      box-shadow: inset 0 -9px #ffe4d8;
    }

    .pearls {
      position: absolute;
      right: 11px;
      bottom: 11px;
      left: 11px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    .pearl {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #55313a;
      box-shadow: inset 3px 2px rgba(255, 255, 255, 0.16);
    }

    .question {
      margin: 0 0 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 5vw, 1.8rem);
      line-height: 1.25;
    }

    .buttons {
      position: relative;
      display: flex;
      min-height: 58px;
      justify-content: center;
      gap: 12px;
    }

    button {
      min-width: 126px;
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    #yes {
      position: relative;
      z-index: 2;
      color: #fff;
      background: var(--hot-pink);
      box-shadow: 0 7px 0 #bd3a68, 0 12px 20px rgba(221, 71, 123, 0.24);
    }

    #yes:hover, #yes:focus-visible {
      background: #c93669;
      transform: translateY(-2px);
    }

    #no {
      position: absolute;
      left: calc(50% + 12px);
      top: 0;
      color: var(--hot-pink);
      background: #fff;
      box-shadow: 0 6px 0 #f3c7d3;
    }

    #no:hover, #no:focus-visible { background: #fff7fa; }

    .answer {
      display: none;
      margin: 21px 0 0;
      color: var(--hot-pink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
      font-weight: bold;
      line-height: 1.3;
      animation: arrive 0.45s ease both;
    }

    .answer.visible { display: block; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(15px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(8deg); }
    }

    @media (max-width: 480px) {
      .page { padding: 20px 14px; }
      .note { padding: 31px 19px 28px; border-radius: 24px; }
      .sparkle { display: none; }
      .boba-stage { margin-top: 23px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="sparkle one" aria-hidden="true">✦</span>
    <span class="sparkle two" aria-hidden="true">♡</span>
    <span class="sparkle three" aria-hidden="true">✦</span>

    <section class="note" aria-labelledby="title">
      <p class="eyebrow">a little question for you</p>
      <h1 id="title">You make my heart go boba-boba.</h1>
      <p class="subtitle">And I know the perfect place for two cups, two straws, and a little adventure.</p>

      <div class="boba-stage" aria-label="A pink boba tea with tapioca pearls">
        <div class="straw"></div>
        <div class="cup">
          <div class="cream"></div>
          <div class="pearls" aria-hidden="true">
            <span class="pearl"></span><span class="pearl"></span><span class="pearl"></span>
            <span class="pearl"></span><span class="pearl"></span><span class="pearl"></span>
            <span class="pearl"></span><span class="pearl"></span><span class="pearl"></span>
          </div>
        </div>
      </div>

      <p class="question">Would you like to go on a date with me?</p>
      <div class="buttons" id="buttonArea">
        <button id="yes" type="button">Yes, absolutely!</button>
        <button id="no" type="button">No</button>
      </div>
      <p class="answer" id="answer" role="status">Yay! It’s a date! Snackza, 27th October. Your yes has my entire week ♡</p>
    </section>
  </main>

  <script>
    const noButton = document.querySelector('#no');
    const yesButton = document.querySelector('#yes');
    const buttonArea = document.querySelector('#buttonArea');
    const answer = document.querySelector('#answer');

    function dodgeNo() {
      const button = noButton.getBoundingClientRect();
      const padding = 12;
      const maxX = Math.max(padding, window.innerWidth - button.width - padding);
      const maxY = Math.max(padding, window.innerHeight - button.height - padding);
      const nextX = padding + Math.random() * (maxX - padding);
      const nextY = padding + Math.random() * (maxY - padding);
      noButton.style.position = 'fixed';
      noButton.style.left = `${nextX}px`;
      noButton.style.top = `${nextY}px`;
    }

    noButton.addEventListener('mouseenter', dodgeNo);
    noButton.addEventListener('focus', dodgeNo);
    noButton.addEventListener('touchstart', (event) => {
      event.preventDefault();
      dodgeNo();
    }, { passive: false });

    yesButton.addEventListener('click', () => {
      answer.classList.add('visible');
      yesButton.textContent = 'Yay!';
      noButton.style.display = 'none';
      yesButton.setAttribute('aria-label', 'Yay, it is a date');
    });
  </script>
</body>
</html>
